[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "polarfunc-repro"
version = "0.1.0"
description = "Reproducible workflows for Antarctic functional dark matter research"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "hydra-core>=1.3,<2",
  "omegaconf>=2.3,<3",
  "pydantic>=2.8,<3",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
data = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17,<21",
]
ml = [
  "joblib>=1.4,<2",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
]
gpu = [
  "accelerate>=1,<2",
  "torch>=2.5,<3",
  "transformers>=4.46,<5",
]
ood = [
  "puncc>=0.9.3,<0.10",
  "pytorch-ood>=0.3.2,<0.4",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
polarfunc = "polarfunc_repro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["*.egg-info", "*.egg-info.*", "*.__pycache__", "*.__pycache__.*"]

[tool.setuptools.exclude-package-data]
"*" = ["._*", "*/._*", "__pycache__/*", "*/__pycache__/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["._*", "launch_plans", "preflight_inputs", "probes", "runs"]
